<div class="action-buttons dashboard-table-actions">
  <span *ngIf="busy" class="row-action-spinner spinner-border spinner-border-sm text-primary" role="status" aria-label="Loading"></span>
  <ng-container *ngIf="!busy">
    <a *ngIf="viewLink?.length" class="btn btn-sm btn-outline-primary" [routerLink]="viewLink" [title]="viewTitle" [attr.aria-label]="viewTitle">
      <svg class="dash-action-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M8 1.33333C4.32 1.33333 1.33333 4.32 1.33333 8C1.33333 11.68 4.32 14.6667 8 14.6667C11.68 14.6667 14.6667 11.68 14.6667 8C14.6667 4.32 11.68 1.33333 8 1.33333ZM8 12.6667C5.42667 12.6667 3.33333 10.5733 3.33333 8C3.33333 5.42667 5.42667 3.33333 8 3.33333C10.5733 3.33333 12.6667 5.42667 12.6667 8C12.6667 10.5733 10.5733 12.6667 8 12.6667ZM8 5.33333C6.89333 5.33333 6 6.22667 6 7.33333C6 8.44 6.89333 9.33333 8 9.33333C9.10667 9.33333 10 8.44 10 7.33333C10 6.22667 9.10667 5.33333 8 5.33333Z" fill="currentColor"/>
      </svg>
    </a>
    <button *ngIf="showViewButton && !viewLink?.length" type="button" class="btn btn-sm btn-outline-primary" (click)="viewClick.emit()" [title]="viewTitle" [attr.aria-label]="viewTitle">
      <svg class="dash-action-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M8 1.33333C4.32 1.33333 1.33333 4.32 1.33333 8C1.33333 11.68 4.32 14.6667 8 14.6667C11.68 14.6667 14.6667 11.68 14.6667 8C14.6667 4.32 11.68 1.33333 8 1.33333ZM8 12.6667C5.42667 12.6667 3.33333 10.5733 3.33333 8C3.33333 5.42667 5.42667 3.33333 8 3.33333C10.5733 3.33333 12.6667 5.42667 12.6667 8C12.6667 10.5733 10.5733 12.6667 8 12.6667ZM8 5.33333C6.89333 5.33333 6 6.22667 6 7.33333C6 8.44 6.89333 9.33333 8 9.33333C9.10667 9.33333 10 8.44 10 7.33333C10 6.22667 9.10667 5.33333 8 5.33333Z" fill="currentColor"/>
      </svg>
    </button>
    <a *ngIf="analyticsLink?.length" class="btn btn-sm btn-outline-primary" [routerLink]="analyticsLink" title="Analytics" aria-label="Analytics">
      <svg class="dash-action-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M2 14H14M4 14V8M8 14V4M12 14V10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <button *ngIf="showBook" type="button" class="btn btn-sm btn-primary" (click)="book.emit()" [title]="bookTitle" [attr.aria-label]="bookTitle">
      <svg class="dash-action-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M5.33333 1.33333V3.33333M10.6667 1.33333V3.33333M2.66667 6H13.3333M3.33333 2.66667H12.6667C13.403 2.66667 14 3.26362 14 4V12.6667C14 13.403 13.403 14 12.6667 14H3.33333C2.59695 14 2 13.403 2 12.6667V4C2 3.26362 2.59695 2.66667 3.33333 2.66667Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button *ngIf="showEdit" type="button" class="btn btn-sm btn-outline-primary" (click)="edit.emit()" [title]="editTitle" [attr.aria-label]="editTitle">
      <svg class="dash-action-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M11.3333 2.00001C11.5084 1.8249 11.7163 1.68601 11.9447 1.5913C12.1731 1.49659 12.4173 1.44824 12.6633 1.44824C12.9094 1.44824 13.1536 1.49659 13.382 1.5913C13.6104 1.68601 13.8183 1.8249 13.9933 2.00001C14.1684 2.17512 14.3073 2.38301 14.402 2.61141C14.4967 2.83981 14.5451 3.08401 14.5451 3.33001C14.5451 3.57601 14.4967 3.82021 14.402 4.04861C14.3073 4.27701 14.1684 4.4849 13.9933 4.66001L5.33333 13.32L1.33333 14.6667L2.68 10.6667L11.3333 2.00001Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button *ngIf="verificationUi === 'action' || (verificationUi === null && showVerify)" type="button" class="btn btn-sm btn-outline-success" (click)="verify.emit()" [title]="verifyTitle" [attr.aria-label]="verifyTitle">
      <svg class="dash-action-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M13.3333 4L6 11.3333L2.66667 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span *ngIf="verificationUi === 'verified'" class="verification-pill verification-pill--verified" title="Account verified">Verified</span>
    <span *ngIf="verificationUi === 'rejected'" class="verification-pill verification-pill--rejected" title="Account rejected">Rejected</span>
    <button *ngIf="showDelete" type="button" class="btn btn-sm btn-outline-danger" (click)="delete.emit()" [title]="deleteTitle" [attr.aria-label]="deleteTitle">
      <svg class="dash-action-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M2 4H14M5.33333 4V2.66667C5.33333 2.31305 5.47381 1.97391 5.72386 1.72386C5.97391 1.47381 6.31305 1.33333 6.66667 1.33333H9.33333C9.68696 1.33333 10.0261 1.47381 10.2761 1.72386C10.5262 1.97391 10.6667 2.31305 10.6667 2.66667V4M12.6667 4V13.3333C12.6667 13.687 12.5262 14.0261 12.2761 14.2761C12.0261 14.5262 11.687 14.6667 11.3333 14.6667H4.66667C4.31305 14.6667 3.97391 14.5262 3.72386 14.2761C3.47381 14.0261 3.33333 13.687 3.33333 13.3333V4H12.6667Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </ng-container>
</div>
