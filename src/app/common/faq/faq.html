<app-header></app-header>

<!-- FAQ Banner Section -->
<section class="faq-banner-section py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-12 text-center">
        <div class="faq-badge mb-4">
          <span class="badge-text">FAQ's</span>
        </div>
        <h1 class="faq-main-title mb-3">
          All Questions Answered <br>Right Here
        </h1>
      </div>
    </div>
  </div>
</section>

<!-- FAQ Accordion Section -->
<section class="faq-accordion-section py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="faq-container bg-light rounded-4 p-4 p-md-5">
          <div class="accordion accordion-flush" id="faqAccordion">
            <!-- FAQ Items rendered dynamically via Angular -->
            <div class="accordion-item border-0 mb-3" *ngFor="let faq of faqs; let i = index">
              <h2 class="accordion-header" [id]="'faq' + i">
                <button class="accordion-button" [class.collapsed]="activeFaqIndex !== i" type="button"
                  (click)="toggleFaq(i)" [attr.aria-expanded]="activeFaqIndex === i"
                  [attr.aria-controls]="'collapse' + i">
                  <div class="faq-content-wrapper w-100 d-flex align-items-center">
                    <span class="faq-number me-4">{{ faq.number }}</span>
                    <span class="faq-question flex-grow-1 text-start">{{ faq.question }}</span>
                    <div class="faq-icon-wrapper ms-3">
                      <div
                        class="faq-icon-circle bg-primary rounded-circle d-flex align-items-center justify-content-center">
                        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"
                          class="faq-icon-minus" [class.d-none]="activeFaqIndex !== i">
                          <path d="M2 6H10" stroke="white" stroke-width="2" stroke-linecap="round" />
                        </svg>
                        <svg width="17" height="17" viewBox="0 0 17 17" fill="none" xmlns="http://www.w3.org/2000/svg"
                          class="faq-icon-plus" [class.d-none]="activeFaqIndex === i">
                          <path d="M8.5 3V14M3 8.5H14" stroke="white" stroke-width="2" stroke-linecap="round" />
                        </svg>
                      </div>
                    </div>
                  </div>
                </button>
              </h2>
              <div [id]="'collapse' + i" class="accordion-collapse collapse" [class.show]="activeFaqIndex === i"
                [attr.aria-labelledby]="'faq' + i" data-bs-parent="#faqAccordion">
                <div class="accordion-body">
                  <p class="faq-answer">
                    {{ faq.answer }}
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Enhanced Collaboration Section -->
<section class="collaboration-section py-5">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="collaboration-banner border border-primary border-2 rounded-4 p-4 p-md-5">
          <div class="row align-items-center">
            <div class="col-md-4 mb-4 mb-md-0">
              <img src="/images/collaboration/collaboration-image.png" alt="Collaboration"
                class="img-fluid rounded-3 collaboration-image">
            </div>
            <div class="col-md-5 mb-4 mb-md-0">
              <h3 class="fw-semibold mb-3">Enhanced Collaboration</h3>
              <p class="text-muted mb-0">Our system makes it easy for healthcare professionals to share and collaborate
                on patient care.</p>
            </div>
            <div class="col-md-3 text-center text-md-end">
              <button class="btn btn-primary btn-lg rounded-pill px-4 py-3" (click)="navigateToAuthOrDashboard()">
                Try It Now
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<app-footer></app-footer>
