<app-header></app-header>

<!-- FAQ Banner Section -->
<section class="faq-banner-section py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-12 text-center">
        <div class="faq-badge mb-4" appScrollAnimate="fade-up">
          <span class="badge-text">FAQ's</span>
        </div>
        <h1 class="faq-main-title mb-3 hide-br-mobile" appScrollAnimate="fade-up" [animDelay]="80">
          All Questions Answered <br>Right Here
        </h1>
      </div>
    </div>
  </div>
</section>

<!-- FAQ Accordion Section -->
<section class="faq-accordion-section py-5">
  <div class="container">
    <div class="row justify-content-center" appScrollAnimate="fade-up" [animDelay]="160">
      <div class="col-lg-10">
        <div class="faq-accordion accordion" id="faqAccordion">
          <div class="accordion-item" *ngFor="let faq of faqs; let i = index" appScrollAnimate="fade-up"
            [animDelay]="i * 100">
            <h2 class="accordion-header">
              <button class="accordion-button" [class.collapsed]="activeFaqIndex !== i" type="button" 
                (click)="toggleFaq(i)" [attr.aria-expanded]="activeFaqIndex === i"
                [attr.aria-controls]="'collapse' + i">
                <span class="faq-number d-none d-md-inline-block">{{ (i + 1) | number: '2.0' }}</span>
                {{ faq.question }}
              </button>
            </h2>
            <div [id]="'collapse' + i" class="accordion-collapse collapse" [class.show]="activeFaqIndex === i">
              <div class="accordion-body">
                {{ faq.answer }}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Enhanced Collaboration Section -->
<section class="collaboration-section py-5">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="collaboration-banner border border-primary border-2 rounded-4 p-4 p-md-5"
          appScrollAnimate="scale-up">
          <div class="row align-items-center">
            <div class="col-md-4 mb-4 mb-md-0">
              <img src="/images/collaboration/collaboration-image.png" alt="Collaboration"
                class="img-fluid rounded-3 collaboration-image">
            </div>
            <div class="col-md-5 mb-4 mb-md-0">
              <h3 class="fw-semibold mb-3">Enhanced Collaboration</h3>
              <p class="text-muted mb-0">Our system makes it easy for healthcare professionals to share and collaborate
                on patient care.</p>
            </div>
            <div class="col-md-3 text-center text-md-end">
              <button class="btn btn-primary btn-lg rounded-pill px-4 py-3" (click)="navigateToAuthOrDashboard()">
                Try It Now
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<app-footer></app-footer>
