<app-header></app-header>

<div class="auth-page-wrapper">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7 col-sm-9">
        <div class="auth-card">
          <div class="auth-card-header text-center">
            <div class="auth-logo">
              <img src="/images/logo/logo.svg" alt="Medrotic Logo" class="auth-logo-img" onerror="this.onerror=null; this.src='/images/logo/logo.png';">
            </div>
            <h2 class="auth-title">Reset Password</h2>
            <p class="auth-subtitle">Enter your new password</p>
          </div>

          <form (ngSubmit)="onSubmit()" #resetPasswordForm="ngForm" class="auth-form">
            <!-- New Password -->
            <div class="form-group">
              <label for="newPassword" class="form-label">New Password <span class="text-danger">*</span></label>
              <div class="custom-input-wrapper password-wrapper">
                <input
                  id="newPassword"
                  [type]="showPassword ? 'text' : 'password'"
                  class="custom-input password-input"
                  placeholder="Enter your new password"
                  [(ngModel)]="newPassword"
                  name="newPassword"
                  required
                  minlength="8"
                />
                <button 
                  class="custom-input-eye-btn" 
                  type="button"
                  (click)="togglePasswordVisibility('password')"
                  aria-label="Toggle password visibility"
                >
                  <img 
                    [src]="showPassword ? eyeOpenIcon : eyeOffIcon" 
                    alt="Toggle password visibility"
                    title="Toggle password visibility"
                    class="eye-icon"
                  />
                </button>
              </div>
              <small class="form-text text-muted" style="font-size: 0.75rem; color: rgba(0, 16, 71, 0.6); margin-top: 0.25rem; display: block;">
                Must be at least 8 characters with uppercase, lowercase, and number
              </small>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
              <label for="confirmPassword" class="form-label">Confirm Password <span class="text-danger">*</span></label>
              <div class="custom-input-wrapper password-wrapper">
                <input
                  id="confirmPassword"
                  [type]="showConfirmPassword ? 'text' : 'password'"
                  class="custom-input password-input"
                  placeholder="Confirm your new password"
                  [(ngModel)]="confirmPassword"
                  name="confirmPassword"
                  required
                />
                <button 
                  class="custom-input-eye-btn" 
                  type="button"
                  (click)="togglePasswordVisibility('confirm')"
                  aria-label="Toggle confirm password visibility"
                >
                  <img 
                    [src]="showConfirmPassword ? eyeOpenIcon : eyeOffIcon" 
                    alt="Toggle password visibility"
                    title="Toggle password visibility"
                    class="eye-icon"
                  />
                </button>
              </div>
            </div>

            <!-- Error Message -->
            <div *ngIf="error" class="alert alert-danger" role="alert">
              <i class="bi bi-exclamation-circle me-2"></i>
              {{ error }}
            </div>

            <!-- Success Message -->
            <div *ngIf="success" class="alert alert-success" role="alert">
              <i class="bi bi-check-circle me-2"></i>
              Password reset successful! Redirecting to login...
            </div>

            <!-- Submit Button -->
            <button 
              type="submit" 
              class="btn btn-primary w-100 auth-submit-btn"
              [disabled]="loading || !resetPasswordForm.form.valid"
            >
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              {{ loading ? 'Resetting...' : 'Reset Password' }}
            </button>

            <!-- Back to Login Link -->
            <div class="text-center auth-footer">
              <a [routerLink]="['/auth/login']" class="text-decoration-none signup-link">
                <i class="bi bi-arrow-left me-1"></i>
                Back to Sign In
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
