<div class="auth-split">
  <!-- Left Side: Branding -->
  <aside class="auth-split__brand">
    <a routerLink="/home" class="auth-split__logo" aria-label="Return to Medrotic Home">
      <img src="/images/logo/logo.svg" alt="Medrotic Logo" style="filter: brightness(0) invert(1);">
    </a>
    
    <div class="auth-split__content">
      <h1 class="auth-split__title">Security is our priority.</h1>
      <p class="auth-split__sub">Don't worry, we'll help you securely recover your account access in just a few simple steps.</p>
      
      <div class="auth-split__features">
        <div class="auth-split__feature">
          <span class="auth-split__feature-icon" style="-webkit-mask-image: url('/images/svg-icons/shield-check-light.svg'); mask-image: url('/images/svg-icons/shield-check-light.svg');"></span>
          <span>Multi-factor Verification</span>
        </div>
        <div class="auth-split__feature">
          <span class="auth-split__feature-icon" style="-webkit-mask-image: url('/images/svg-icons/lock-light.svg'); mask-image: url('/images/svg-icons/lock-light.svg');"></span>
          <span>Secure Password Reset</span>
        </div>
        <div class="auth-split__feature">
          <span class="auth-split__feature-icon" style="-webkit-mask-image: url('/images/svg-icons/information-circle-light.svg'); mask-image: url('/images/svg-icons/information-circle-light.svg');"></span>
          <span>Instant Account Recovery</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Right Side: Form -->
  <main class="auth-split__form">
    <div class="auth-split__form-inner">
      <a routerLink="/home" class="auth-logo-mobile">
        <img src="/images/logo/logo.svg" alt="Medrotic Logo" onerror="this.onerror=null; this.src='/images/logo/logo.png';">
      </a>
      
      <div class="auth-card-header">
        <h2 class="auth-title">Password Recovery</h2>
        <p class="auth-subtitle">Regain access to your Medrotic account</p>
      </div>

      <form (ngSubmit)="onSubmit()" #forgotPasswordForm="ngForm" class="auth-form mt-4">
        <!-- Method Selector -->
        <div class="form-group">
          <label class="form-label">Recovery Method</label>
          <div class="auth-method-selector" role="group">
            <input type="radio" class="btn-check" id="method-email" [(ngModel)]="method" value="email" name="method">
            <label class="btn btn-outline-primary" for="method-email">Email</label>
            
            <input type="radio" class="btn-check" id="method-sms" [(ngModel)]="method" value="sms" name="method">
            <label class="btn btn-outline-primary" for="method-sms">SMS</label>
          </div>
        </div>

        <!-- Email Input -->
        <div class="form-group" *ngIf="method === 'email'">
          <label for="email" class="form-label">Email Address</label>
          <input
            id="email"
            type="email"
            class="custom-input-simple"
            placeholder="Enter your email"
            [(ngModel)]="email"
            name="email"
            required
          />
        </div>

        <!-- Phone Input -->
        <div class="form-group" *ngIf="method === 'sms'">
          <label for="phone" class="form-label">Phone Number</label>
          <input
            id="phone"
            type="text"
            class="custom-input-simple"
            placeholder="+92-300-1234567"
            [(ngModel)]="phone"
            name="phone"
            pkInputFormat="phone"
            required
          />
        </div>

        <!-- Error Message -->
        <div *ngIf="error" class="alert alert-danger" role="alert">
          <i class="bi bi-exclamation-circle me-2"></i>
          {{ error }}
        </div>

        <!-- Success Message -->
        <div *ngIf="success" class="alert alert-success" role="alert">
          <i class="bi bi-check-circle me-2"></i>
          {{ message }}
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          class="btn btn-primary w-100 auth-submit-btn mt-2"
          [disabled]="loading || !forgotPasswordForm.form.valid"
        >
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          {{ loading ? 'Sending...' : 'Send Reset Instructions' }}
        </button>

        <!-- Back to Login Link -->
        <div class="text-center auth-footer">
          <a [routerLink]="['/auth/login']" class="text-decoration-none signup-link">
            <i class="bi bi-arrow-left me-1"></i>
            Back to Sign In
          </a>
        </div>
      </form>
    </div>
  </main>
</div>
