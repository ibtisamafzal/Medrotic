<app-header></app-header>

<div class="auth-page-wrapper">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7 col-sm-9">
        <div class="auth-card">
          <div class="auth-card-header text-center">
            <div class="auth-logo">
              <img src="/images/logo/logo.svg" alt="Medrotic Logo" class="auth-logo-img" onerror="this.onerror=null; this.src='/images/logo/logo.png';">
            </div>
            <h2 class="auth-title">Forgot Password?</h2>
            <p class="auth-subtitle">Enter your email or phone number to receive reset instructions</p>
          </div>

          <form (ngSubmit)="onSubmit()" #forgotPasswordForm="ngForm" class="auth-form">
            <!-- Method Selector -->
            <div class="form-group">
              <label class="form-label">Recovery Method</label>
              <div class="auth-method-selector" role="group">
                <input type="radio" class="btn-check" id="method-email" [(ngModel)]="method" value="email" name="method">
                <label class="btn btn-outline-primary" for="method-email">Email</label>
                
                <input type="radio" class="btn-check" id="method-sms" [(ngModel)]="method" value="sms" name="method">
                <label class="btn btn-outline-primary" for="method-sms">SMS</label>
              </div>
            </div>

            <!-- Email Input -->
            <div class="form-group" *ngIf="method === 'email'">
              <label for="email" class="form-label">Email Address</label>
              <input
                id="email"
                type="email"
                class="custom-input-simple"
                placeholder="Enter your email"
                [(ngModel)]="email"
                name="email"
                required
              />
            </div>

            <!-- Phone Input -->
            <div class="form-group" *ngIf="method === 'sms'">
              <label for="phone" class="form-label">Phone Number</label>
              <input
                id="phone"
                type="text"
                class="custom-input-simple"
                placeholder="+92 XXX XXXXXXX"
                [(ngModel)]="phone"
                name="phone"
                required
                (input)="onPhoneInput($event)"
              />
            </div>

            <!-- Error Message -->
            <div *ngIf="error" class="alert alert-danger" role="alert">
              <i class="bi bi-exclamation-circle me-2"></i>
              {{ error }}
            </div>

            <!-- Success Message -->
            <div *ngIf="success" class="alert alert-success" role="alert">
              <i class="bi bi-check-circle me-2"></i>
              {{ message }}
            </div>

            <!-- Submit Button -->
            <button 
              type="submit" 
              class="btn btn-primary w-100 auth-submit-btn"
              [disabled]="loading || !forgotPasswordForm.form.valid"
            >
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              {{ loading ? 'Sending...' : 'Send Reset Instructions' }}
            </button>

            <!-- Back to Login Link -->
            <div class="text-center auth-footer">
              <a [routerLink]="['/auth/login']" class="text-decoration-none signup-link">
                <i class="bi bi-arrow-left me-1"></i>
                Back to Sign In
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
