<app-header></app-header>

<div class="auth-page-wrapper">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7 col-sm-9">
        <div class="auth-card">
          <div class="auth-card-header text-center">
            <div class="auth-logo">
              <span class="logo-text">
                Med<span class="text-primary">rotic</span>
              </span>
              <div class="logo-icon position-relative">
                <svg width="19" height="19" viewBox="0 0 19 19" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="9.5" cy="9.5" r="9.5" fill="#3461FF"/>
                </svg>
                <svg class="position-absolute top-50 start-50 translate-middle medrotic-logo-inner" width="21" height="18" viewBox="0 0 21 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M3.52 0.98L17.48 0.98L10.5 17.02L3.52 0.98Z" fill="white"/>
                </svg>
              </div>
            </div>
            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Sign in to your Medrotic account to continue</p>
          </div>

          <form (ngSubmit)="onLogin()" #loginForm="ngForm" class="auth-form">
            <!-- Login Method Selector (Email/Phone/CNIC) -->
            <div class="form-group">
              <div class="auth-method-selector" role="group">
                <input type="radio" class="btn-check" id="login-email" [(ngModel)]="loginMethod" value="email" name="loginMethod">
                <label class="btn btn-outline-primary" for="login-email">Email</label>
                
                <input type="radio" class="btn-check" id="login-phone" [(ngModel)]="loginMethod" value="phone" name="loginMethod">
                <label class="btn btn-outline-primary" for="login-phone">Phone</label>
                
                <input type="radio" class="btn-check" id="login-cnic" [(ngModel)]="loginMethod" value="cnic" name="loginMethod">
                <label class="btn btn-outline-primary" for="login-cnic">CNIC</label>
              </div>
            </div>

            <!-- Role Selector -->
            <div class="form-group">
              <label for="role" class="form-label">Role</label>
              <select 
                id="role"
                class="form-select auth-select"
                [(ngModel)]="selectedRole" 
                name="role"
                required
              >
                <option value="patient">Patient</option>
                <option value="doctor">Doctor</option>
                <option value="admin">Admin</option>
              </select>
            </div>

            <!-- Email/Phone/CNIC Input -->
            <div class="form-group">
              <label [for]="loginMethod" class="form-label">{{ getIdentifierLabel() }}</label>
              <input
                [id]="loginMethod"
                [type]="loginMethod === 'email' ? 'email' : 'text'"
                class="custom-input-simple"
                [placeholder]="getIdentifierPlaceholder()"
                [title]="getIdentifierPlaceholder()"
                [attr.aria-label]="getIdentifierLabel()"
                [(ngModel)]="identifierValue"
                [name]="loginMethod"
                required
                [attr.maxlength]="loginMethod === 'cnic' ? '15' : null"
                (input)="loginMethod === 'cnic' ? onCNICInput($event) : (loginMethod === 'phone' ? onPhoneInput($event) : null)"
              />
            </div>

            <!-- Password Input -->
            <div class="form-group">
              <label for="password" class="form-label">Password</label>
              <div class="custom-input-wrapper password-wrapper">
                <input
                  id="password"
                  [type]="showPassword ? 'text' : 'password'"
                  class="custom-input password-input"
                  placeholder="Enter your password"
                  [(ngModel)]="password"
                  name="password"
                  required
                  minlength="6"
                />
                <button 
                  class="custom-input-eye-btn" 
                  type="button"
                  (click)="togglePasswordVisibility()"
                  aria-label="Toggle password visibility"
                >
                  <img 
                    [src]="showPassword ? eyeOpenIcon : eyeOffIcon" 
                    alt="Toggle password visibility"
                    title="Toggle password visibility"
                    class="eye-icon"
                  />
                </button>
              </div>
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="d-flex justify-content-between align-items-center form-options">
              <div class="form-check">
                <input 
                  class="form-check-input" 
                  type="checkbox" 
                  id="rememberMe"
                  [(ngModel)]="rememberMe"
                  name="rememberMe"
                />
                <label class="form-check-label" for="rememberMe">
                  Remember me
                </label>
              </div>
              <a [routerLink]="['/auth/forgot-password']" class="text-decoration-none forgot-password-link">
                Forgot Password?
              </a>
            </div>

            <!-- Error Message -->
            <div *ngIf="error" class="alert alert-danger" role="alert">
              <i class="bi bi-exclamation-circle me-2"></i>
              {{ error }}
            </div>

            <!-- Submit Button -->
            <button 
              type="submit" 
              class="btn btn-primary w-100 auth-submit-btn"
              [disabled]="loading || !loginForm.form.valid"
            >
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              {{ loading ? 'Signing in...' : 'Sign in' }}
            </button>

            <!-- Divider -->
            <div class="divider d-flex align-items-center">
              <hr class="flex-grow-1">
              <span class="px-3">or</span>
              <hr class="flex-grow-1">
            </div>

            <!-- Google Sign-in Button -->
            <button 
              type="button" 
              class="btn btn-outline-primary w-100 google-signin-btn"
              (click)="onGoogleLogin()"
              [disabled]="loading"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" class="me-2">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
              </svg>
              Sign in with Google
            </button>

            <!-- Sign Up Link -->
            <div class="text-center auth-footer">
              <p class="mb-0 auth-footer-text">
                Don't have an account?
                <a [routerLink]="['/auth/register']" class="text-decoration-none signup-link">Sign up</a>
              </p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
