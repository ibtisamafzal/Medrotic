<div class="profile-settings-page">
  <div class="page-header mb-4">
    <h2 class="page-title">Profile Settings</h2>
    <p class="page-subtitle">Manage your personal information and CNIC verification</p>
  </div>

  <div class="row g-4">
    <div class="col-12 col-lg-8">
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Personal Information</h3>
        </div>
        <div class="card-body">
          <form (ngSubmit)="saveProfile()" *ngIf="!loading">
            <div class="row g-3">
              <div class="col-12 col-md-6">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" [(ngModel)]="profile.name" name="name" required
                  title="Full Name" placeholder="Enter your full name">
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" [(ngModel)]="profile.email" name="email" disabled
                  title="Email" placeholder="Email is read-only">
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label">Phone Number</label>
                <input type="tel" class="form-control" [(ngModel)]="profile.phone" name="phone"
                  pkInputFormat="phone"
                  title="Phone Number" placeholder="+92 300 1234567">
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label">Date of Birth</label>
                <input type="date" class="form-control" [(ngModel)]="profile.dateOfBirth" name="dateOfBirth"
                  title="Date of Birth">
              </div>
              <div class="col-12">
                <label class="form-label">Address</label>
                <textarea class="form-control" rows="3" [(ngModel)]="profile.address" name="address"
                  title="Address" placeholder="City, Province (e.g., Sahiwal, Punjab)"></textarea>
              </div>
            </div>
            <div class="mt-4">
              <button type="submit" class="btn btn-primary" [disabled]="saving">
                <span *ngIf="saving" class="spinner-border spinner-border-sm me-2"></span>
                {{ saving ? 'Saving...' : 'Save Changes' }}
              </button>
            </div>
          </form>
          <div *ngIf="loading" class="text-center py-4">
            <div class="spinner-border text-primary" role="status"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-4">
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">CNIC Verification</h3>
        </div>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label">CNIC Number</label>
            <input type="text" class="form-control" [(ngModel)]="profile.cnic" name="cnic" 
                   pkInputFormat="cnic"
                   maxlength="15"
                   inputmode="numeric"
                   placeholder="12345-1234567-1" pattern="[0-9]{5}-[0-9]{7}-[0-9]{1}">
            <small class="form-text text-muted">Format: 12345-1234567-1</small>
          </div>
          
          <div class="mb-3" *ngIf="cnicVerified">
            <div class="alert alert-success d-flex align-items-center">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" class="me-2">
                <path d="M10 18.3333C14.6024 18.3333 18.3333 14.6024 18.3333 10C18.3333 5.39763 14.6024 1.66667 10 1.66667C5.39763 1.66667 1.66667 5.39763 1.66667 10C1.66667 14.6024 5.39763 18.3333 10 18.3333Z" stroke="currentColor" stroke-width="2"/>
                <path d="M7.5 10L9.16667 11.6667L12.5 8.33333" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              CNIC Verified
            </div>
          </div>

          <div class="mb-3" *ngIf="cnicVerificationMessage && !cnicVerified">
            <div class="alert alert-warning">
              {{ cnicVerificationMessage }}
            </div>
          </div>

          <button type="button" class="btn btn-outline-primary w-100" 
                  (click)="verifyCNIC()" [disabled]="cnicVerifying || !profile.cnic">
            <span *ngIf="cnicVerifying" class="spinner-border spinner-border-sm me-2"></span>
            {{ cnicVerifying ? 'Verifying...' : (cnicVerified ? 'Re-verify CNIC' : 'Verify CNIC') }}
          </button>
        </div>
      </div>

      <div class="card mt-4">
        <div class="card-header">
          <h3 class="card-title">Change Password</h3>
        </div>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label">Current Password</label>
              <input type="password" class="form-control" title="Current Password" placeholder="Current password">
          </div>
          <div class="mb-3">
            <label class="form-label">New Password</label>
              <input type="password" class="form-control" title="New Password" placeholder="New password">
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm New Password</label>
              <input type="password" class="form-control" title="Confirm New Password" placeholder="Confirm new password">
          </div>
          <button type="button" class="btn btn-outline-secondary w-100">Update Password</button>
        </div>
      </div>
    </div>
  </div>
</div>
