<div class="patient-portal-layout">
  <!-- Sidebar -->
  <aside class="patient-sidebar" [class.collapsed]="sidebarCollapsed">
    <div class="sidebar-header">
      <div class="logo">
        <img src="/images/logo/logo.svg" alt="Medrotic Logo" class="sidebar-logo"
          onerror="this.onerror=null; this.src='/images/logo/logo.png';">
        <img src="/images/logo/logo-icon.svg" alt="Medrotic" class="sidebar-logo-icon"
          onerror="this.onerror=null; this.src='/images/logo/logo.png';">
      </div>
      <button type="button" class="sidebar-toggle" (click)="toggleSidebar()" aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 6L16 6M4 10L16 10M4 14L16 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <div class="sidebar-body">
    <nav class="sidebar-nav">
      <a routerLink="/patient-portal/dashboard" routerLinkActive="active" class="nav-item" title="Dashboard">
        <span class="nav-icon" style="-webkit-mask-image: url('/images/svg-icons/dashboard-square.svg'); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; background-color: currentColor; width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; display: inline-block;" aria-hidden="true"></span>
        <span>Dashboard</span>
      </a>
      <a routerLink="/patient-portal/profile-settings" routerLinkActive="active" class="nav-item"
        title="Profile Settings">
        <span class="nav-icon" style="-webkit-mask-image: url('/images/svg-icons/setting-dark.svg'); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; background-color: currentColor; width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; display: inline-block;" aria-hidden="true"></span>
        <span>Profile Settings</span>
      </a>
      <a routerLink="/patient-portal/view-medical-history" routerLinkActive="active" class="nav-item"
        title="Medical History">
        <span class="nav-icon" style="-webkit-mask-image: url('/images/svg-icons/medical-file.svg'); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; background-color: currentColor; width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; display: inline-block;" aria-hidden="true"></span>
        <span>Medical History</span>
      </a>
      <a routerLink="/patient-portal/add-metrics" routerLinkActive="active" class="nav-item" title="Add Metrics">
        <span class="nav-icon" style="-webkit-mask-image: url('/images/svg-icons/pulse-rectangle.svg'); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; background-color: currentColor; width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; display: inline-block;" aria-hidden="true"></span>
        <span>Add Metrics</span>
      </a>
      <a routerLink="/patient-portal/ai-chatbot" routerLinkActive="active" class="nav-item" title="AI Chatbot">
        <span class="nav-icon" style="-webkit-mask-image: url('/images/svg-icons/Conversation-Chat.svg'); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; background-color: currentColor; width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; display: inline-block;" aria-hidden="true"></span>
        <span>AI Chatbot</span>
      </a>
      <a routerLink="/patient-portal/doctor-search" routerLinkActive="active" class="nav-item" title="Doctor Search">
        <span class="nav-icon" style="-webkit-mask-image: url('/images/svg-icons/search-dark.svg'); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; background-color: currentColor; width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; display: inline-block;" aria-hidden="true"></span>
        <span>Doctor Search</span>
      </a>
      <a routerLink="/patient-portal/test-report-analysis" routerLinkActive="active" class="nav-item"
        title="Test Report Analysis">
        <span class="nav-icon" style="-webkit-mask-image: url('/images/svg-icons/labs.svg'); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; background-color: currentColor; width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; display: inline-block;" aria-hidden="true"></span>
        <span>Test Report Analysis</span>
      </a>
      <a routerLink="/patient-portal/upload-documents" routerLinkActive="active" class="nav-item"
        title="Upload Documents">
        <span class="nav-icon" style="-webkit-mask-image: url('/images/svg-icons/interface-upload-laptop.svg'); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; background-color: currentColor; width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; display: inline-block;" aria-hidden="true"></span>
        <span>Upload Documents</span>
      </a>
      <a routerLink="/patient-portal/view-prescriptions" routerLinkActive="active" class="nav-item"
        title="Prescriptions">
        <span class="nav-icon" style="-webkit-mask-image: url('/images/svg-icons/prescription.svg'); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; background-color: currentColor; width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; display: inline-block;" aria-hidden="true"></span>
        <span>Prescriptions</span>
      </a>
      <a routerLink="/patient-portal/view-xrays" routerLinkActive="active" class="nav-item" title="X-Rays">
        <span class="nav-icon" style="-webkit-mask-image: url('/images/svg-icons/x-ray.svg'); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; background-color: currentColor; width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; display: inline-block;" aria-hidden="true"></span>
        <span>X-Rays</span>
      </a>
      <a routerLink="/patient-portal/notifications" routerLinkActive="active" class="nav-item" title="Notifications">
        <span class="nav-icon" style="-webkit-mask-image: url('/images/svg-icons/notification-dark.svg'); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; background-color: currentColor; width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; display: inline-block;" aria-hidden="true"></span>
        <span>Notifications</span>
      </a>
      <a routerLink="/patient-portal/access-records" routerLinkActive="active" class="nav-item" title="Access Records">
        <span class="nav-icon" style="-webkit-mask-image: url('/images/svg-icons/Drawer-Download.svg'); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; background-color: currentColor; width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; display: inline-block;" aria-hidden="true"></span>
        <span>Access Records</span>
      </a>
    </nav>
    </div>

    <div class="sidebar-footer">
      <button type="button" class="sidebar-logout" (click)="logout()" title="Sign out of Patient Portal" aria-label="Sign out of Patient Portal">
        <span class="nav-icon" style="-webkit-mask-image: url('/images/svg-icons/logout-dark.svg'); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; background-color: currentColor; width: 20px; height: 20px; flex-shrink: 0; display: inline-block;" aria-hidden="true"></span>
        <span class="sidebar-logout-text">Sign out</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="patient-main" [class.sidebar-collapsed]="sidebarCollapsed">
    <header class="patient-header">
      <div class="header-content">
        <h1 class="page-title">Patient Portal</h1>
        <div class="header-actions">
          <a routerLink="/home" class="btn btn-outline-secondary btn-sm">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M8 1.33333L1.33333 8L8 14.6667M1.33333 8H14.6667" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            Back to Home
          </a>

          <div class="user-profile-header d-flex align-items-center ms-3" *ngIf="currentUser$ | async as user">
            <div class="avatar-circle me-2" style="width: 36px; height: 36px; border-radius: 50%; overflow: hidden; background-color: #3461ff; color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.9rem; flex-shrink: 0; box-shadow: 0 2px 8px rgba(52, 97, 255, 0.2);">
              <img *ngIf="user.profilePictureUrl" [src]="user.profilePictureUrl" alt="Avatar" style="width: 100%; height: 100%; object-fit: cover;">
              <span *ngIf="!user.profilePictureUrl">{{ user.name ? user.name.charAt(0).toUpperCase() : 'P' }}</span>
            </div>
            <span class="user-name d-none d-md-inline" style="font-size: 0.9rem; font-weight: 500; color: #1e293b;">{{ user.name }}</span>
          </div>
        </div>
      </div>
    </header>

    <main class="patient-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
