<div class="patient-portal-layout">
  <!-- Sidebar -->
  <aside class="patient-sidebar" [class.collapsed]="sidebarCollapsed">
    <div class="sidebar-header">
      <div class="logo">
        <img src="/images/logo/logo.svg" alt="Medrotic Logo" class="sidebar-logo"
          onerror="this.onerror=null; this.src='/images/logo/logo.png';">
        <img src="/images/logo/logo-icon.svg" alt="Medrotic" class="sidebar-logo-icon"
          onerror="this.onerror=null; this.src='/images/logo/logo.png';">
      </div>
      <button type="button" class="sidebar-toggle" (click)="toggleSidebar()" aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 6L16 6M4 10L16 10M4 14L16 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <div class="sidebar-body">
    <nav class="sidebar-nav">
      <a routerLink="/patient-portal/dashboard" routerLinkActive="active" class="nav-item" title="Dashboard">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.25"/><rect x="14" y="3" width="7" height="7" rx="1.25"/><rect x="3" y="14" width="7" height="7" rx="1.25"/><rect x="14" y="14" width="7" height="7" rx="1.25"/>
        </svg>
        <span>Dashboard</span>
      </a>
      <a routerLink="/patient-portal/profile-settings" routerLinkActive="active" class="nav-item"
        title="Profile Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

        </svg>
        <span>Profile Settings</span>
      </a>
      <a routerLink="/patient-portal/view-medical-history" routerLinkActive="active" class="nav-item"
        title="Medical History">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0zm-9 5.25h.008v.008H12v-.008z"/>
        </svg>
        <span>Medical History</span>
      </a>
      <a routerLink="/patient-portal/add-metrics" routerLinkActive="active" class="nav-item" title="Add Metrics">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/>
        </svg>
        <span>Add Metrics</span>
      </a>
      <a routerLink="/patient-portal/ai-chatbot" routerLinkActive="active" class="nav-item" title="AI Chatbot">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

        </svg>
        <span>AI Chatbot</span>
      </a>
      <a routerLink="/patient-portal/doctor-search" routerLinkActive="active" class="nav-item" title="Doctor Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
        </svg>
        <span>Doctor Search</span>
      </a>
      <a routerLink="/patient-portal/test-report-analysis" routerLinkActive="active" class="nav-item"
        title="Test Report Analysis">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

        </svg>
        <span>Test Report Analysis</span>
      </a>
      <a routerLink="/patient-portal/upload-documents" routerLinkActive="active" class="nav-item"
        title="Upload Documents">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
        </svg>
        <span>Upload Documents</span>
      </a>
      <a routerLink="/patient-portal/view-prescriptions" routerLinkActive="active" class="nav-item"
        title="Prescriptions">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

        </svg>
        <span>Prescriptions</span>
      </a>
      <a routerLink="/patient-portal/view-xrays" routerLinkActive="active" class="nav-item" title="X-Rays">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.558-.646 1.184-.646 1.86s.266 1.301.646 1.86c.38.558.866 1.054 1.641 1.054s1.261-.496 1.641-1.054c.38-.559.646-1.184.646-1.86s-.266-1.301-.646-1.86a2.31 2.31 0 00-1.641-1.054zM12 12.75V21m0-8.25H9.75m2.25 0h2.25M9.75 12.75H8.25m1.5 0h1.5m6.75-6.75v12a2.25 2.25 0 01-2.25 2.25H8.25A2.25 2.25 0 016 18V6.75A2.25 2.25 0 018.25 4.5h7.5A2.25 2.25 0 0118 6.75z"/>
        </svg>
        <span>X-Rays</span>
      </a>
      <a routerLink="/patient-portal/notifications" routerLinkActive="active" class="nav-item" title="Notifications">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/>
        </svg>
        <span>Notifications</span>
      </a>
      <a routerLink="/patient-portal/access-records" routerLinkActive="active" class="nav-item" title="Access Records">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15.75 5.25a3 3 0 013 3m3 0a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h-6v1.125c0 1.243.9 2.25 2.006 2.25h3.988c1.105 0 2.006-1.007 2.006-2.25V9z"/>
        </svg>
        <span>Access Records</span>
      </a>
    </nav>
    </div>

    <div class="sidebar-footer">
      <button type="button" class="sidebar-logout" (click)="logout()" title="Sign out of Patient Portal" aria-label="Sign out of Patient Portal">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span class="sidebar-logout-text">Sign out</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="patient-main" [class.sidebar-collapsed]="sidebarCollapsed">
    <header class="patient-header">
      <div class="header-content">
        <h1 class="page-title">Patient Portal</h1>
        <div class="header-actions">
          <a routerLink="/home" class="btn btn-outline-secondary btn-sm">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M8 1.33333L1.33333 8L8 14.6667M1.33333 8H14.6667" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            Back to Home
          </a>
        </div>
      </div>
    </header>

    <main class="patient-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
