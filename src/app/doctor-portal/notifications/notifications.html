<div class="notifications-page">
  <div class="page-header mb-4">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <h2 class="page-title">Notifications</h2>
        <p class="page-subtitle">Stay updated with your practice activities</p>
      </div>
      <button class="btn btn-outline-primary btn-sm" (click)="markAllAsRead()">
        Mark All as Read
      </button>
    </div>
  </div>

  <div class="card">
    <div class="card-body p-0">
      <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <div *ngIf="!loading">
        <div *ngFor="let notification of notifications" class="notification-item border-bottom p-3" [class.unread]="!notification.read" (click)="markAsRead(notification)">
          <div class="d-flex align-items-start gap-3">
            <div class="notification-icon" [class.bg-info]="notification.type === 'info'" [class.bg-success]="notification.type === 'success'" [class.bg-warning]="notification.type === 'warning'">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 1.66667C8.15905 1.66667 6.66667 3.15905 6.66667 5V8.33333L4.16667 10.8333V12.5H15.8333V10.8333L13.3333 8.33333V5C13.3333 3.15905 11.8409 1.66667 10 1.66667Z" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M7.5 12.5V14.1667C7.5 15.0871 8.24619 15.8333 9.16667 15.8333H10.8333C11.7538 15.8333 12.5 15.0871 12.5 14.1667V12.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="flex-grow-1">
              <p class="mb-1 fw-bold">{{ notification.message }}</p>
              <small class="text-muted">{{ notification.timestamp | date:'short' }}</small>
            </div>
            <div *ngIf="!notification.read" class="unread-indicator"></div>
          </div>
        </div>
        <div *ngIf="notifications.length === 0" class="text-center text-muted py-5">
          No notifications
        </div>
      </div>
    </div>
  </div>
</div>
