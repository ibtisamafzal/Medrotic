<div class="admin-layout">
  <!-- Sidebar -->
  <aside class="admin-sidebar" [class.collapsed]="sidebarCollapsed">
    <div class="sidebar-header">
      <div class="logo">
        <img src="/images/logo/logo.svg" alt="Medrotic Logo" class="sidebar-logo" onerror="this.onerror=null; this.src='/images/logo/logo.png';">
        <img src="/images/logo/logo-icon.svg" alt="Medrotic" class="sidebar-logo-icon" onerror="this.onerror=null; this.src='/images/logo/logo.png';">
      </div>
      <button type="button" class="sidebar-toggle" (click)="toggleSidebar()" aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 6L16 6M4 10L16 10M4 14L16 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="sidebar-body">
    <nav class="sidebar-nav">
      <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-item">
        <span class="nav-icon" style="-webkit-mask-image: url('/images/svg-icons/dashboard-square.svg'); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; background-color: currentColor; width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; display: inline-block;" aria-hidden="true"></span>
        <span>Dashboard</span>
      </a>
      <a routerLink="/admin/manage-doctors" routerLinkActive="active" class="nav-item">
        <span class="nav-icon" style="-webkit-mask-image: url('/images/svg-icons/doctor.svg'); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; background-color: currentColor; width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; display: inline-block;" aria-hidden="true"></span>
        <span>Manage Doctors</span>
      </a>
      <a routerLink="/admin/manage-patients" routerLinkActive="active" class="nav-item">
        <span class="nav-icon" style="-webkit-mask-image: url('/images/svg-icons/patient.svg'); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; background-color: currentColor; width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; display: inline-block;" aria-hidden="true"></span>
        <span>Manage Patients</span>
      </a>
      <a routerLink="/admin/user-verification" routerLinkActive="active" class="nav-item">
        <span class="nav-icon" style="-webkit-mask-image: url('/images/svg-icons/shield-check-dark.svg'); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; background-color: currentColor; width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; display: inline-block;" aria-hidden="true"></span>
        <span>User Verification</span>
      </a>
      <a routerLink="/admin/system-health" routerLinkActive="active" class="nav-item">
        <span class="nav-icon" style="-webkit-mask-image: url('/images/svg-icons/pulse-rectangle.svg'); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; background-color: currentColor; width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; display: inline-block;" aria-hidden="true"></span>
        <span>System Health</span>
      </a>
      <a routerLink="/admin/manage-integrations" routerLinkActive="active" class="nav-item">
        <span class="nav-icon" style="-webkit-mask-image: url('/images/svg-icons/cpu-dark.svg'); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; background-color: currentColor; width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; display: inline-block;" aria-hidden="true"></span>
        <span>Integrations</span>
      </a>
      <a routerLink="/admin/manage-repository" routerLinkActive="active" class="nav-item">
        <span class="nav-icon" style="-webkit-mask-image: url('/images/svg-icons/collection-dark.svg'); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; background-color: currentColor; width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; display: inline-block;" aria-hidden="true"></span>
        <span>Repository</span>
      </a>
      <a routerLink="/admin/analytics" routerLinkActive="active" class="nav-item">
        <span class="nav-icon" style="-webkit-mask-image: url('/images/svg-icons/Analytics-Bars.svg'); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; background-color: currentColor; width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; display: inline-block;" aria-hidden="true"></span>
        <span>Analytics</span>
      </a>
      <a routerLink="/admin/notifications" routerLinkActive="active" class="nav-item">
        <span class="nav-icon" style="-webkit-mask-image: url('/images/svg-icons/notification-dark.svg'); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; background-color: currentColor; width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; display: inline-block;" aria-hidden="true"></span>
        <span>Notifications</span>
      </a>
      <a routerLink="/admin/profile-settings" routerLinkActive="active" class="nav-item">
        <span class="nav-icon" style="-webkit-mask-image: url('/images/svg-icons/setting-dark.svg'); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; background-color: currentColor; width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; display: inline-block;" aria-hidden="true"></span>
        <span>Profile Settings</span>
      </a>
    </nav>
    </div>

    <div class="sidebar-footer">
      <button type="button" class="sidebar-logout" (click)="logout()" title="Sign out of Admin Portal" aria-label="Sign out of Admin Portal">
        <span class="nav-icon" style="-webkit-mask-image: url('/images/svg-icons/logout-dark.svg'); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; background-color: currentColor; width: 20px; height: 20px; flex-shrink: 0; display: inline-block;" aria-hidden="true"></span>
        <span class="sidebar-logout-text">Sign out</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="admin-main" [class.sidebar-collapsed]="sidebarCollapsed">
    <header class="admin-header">
      <div class="header-content">
        <h1 class="page-title">Admin Portal</h1>
        <div class="header-actions">
          <a routerLink="/home" class="btn btn-outline-secondary btn-sm">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M8 1.33333L1.33333 8L8 14.6667M1.33333 8H14.6667" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Back to Home
          </a>
        </div>
      </div>
    </header>

    <main class="admin-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
