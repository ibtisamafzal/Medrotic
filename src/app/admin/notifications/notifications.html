<div class="notifications-page">
  <div class="page-header mb-4 fade-in-down">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <div class="d-flex align-items-center mb-2">
      <img src="images/svg-icons/notification-light.svg" alt="" class="svg-icon-img svg-icon-img--sm page-header__icon me-2" aria-hidden="true">
      <h2 class="page-title mb-0">Notifications</h2>
    </div>
        <p class="page-subtitle">Compose and send alerts to users/groups via push, email, or SMS</p>
      </div>
      <button class="btn btn-primary" (click)="openComposeModal()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 1.33333V14.6667M1.33333 8H14.6667" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Compose Notification
      </button>
    </div>
  </div>

  <!-- Notifications List -->
  <div class="notifications-list">
    <div class="notification-item fade-in-up" *ngFor="let notification of notifications; let i = index" [style.animation-delay]="(i * 50) + 'ms'">
      <div class="notification-icon">
        {{ getTypeIcon(notification.type) }}
      </div>
      <div class="notification-content">
        <div class="notification-header">
          <span class="notification-type">{{ notification.type | uppercase }}</span>
          <span class="notification-date" *ngIf="notification.id">{{ notification.id }}</span>
        </div>
        <p class="notification-message">{{ notification.message }}</p>
        <div class="notification-targets">
          <span class="badge bg-secondary" *ngFor="let target of notification.targets">{{ target }}</span>
        </div>
      </div>
    </div>
    <div class="empty-state" *ngIf="notifications.length === 0">
      <p>No notifications sent yet</p>
    </div>
  </div>

  <!-- Compose Modal -->
  <div class="modal" [class.show]="showComposeModal" *ngIf="showComposeModal" tabindex="-1" (click)="closeComposeModal()">
    <div class="modal-dialog modal-lg" (click)="$event.stopPropagation()">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Compose Notification</h5>
          <button type="button" class="btn-close" (click)="closeComposeModal()" aria-label="Close dialog" title="Close">✕</button>
        </div>
        <div class="modal-body">
          <form>
            <div class="mb-3">
              <label class="form-label">Message</label>
              <textarea 
                class="form-control" 
                rows="4" 
                [(ngModel)]="newNotification.message" 
                name="message" 
                placeholder="Enter notification message..."
                required></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label" for="notif-type">Notification Type</label>
              <select id="notif-type" class="form-select" [(ngModel)]="newNotification.type" name="type" title="Select notification type" aria-label="Notification type">
                <option value="push">Push Notification</option>
                <option value="email">Email</option>
                <option value="sms">SMS</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Targets</label>
              <div class="target-options">
                <div class="form-check" *ngFor="let option of targetOptions">
                  <input 
                    class="form-check-input" 
                    type="checkbox" 
                    [id]="'target-' + option.value"
                    [checked]="newNotification.targets.includes(option.value)"
                    (change)="toggleTarget(option.value)"
                    [title]="'Select target: ' + option.label"
                    [attr.aria-label]="'Target ' + option.label">
                  <label class="form-check-label" [for]="'target-' + option.value">
                    {{ option.label }}
                  </label>
                </div>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="scheduled-at">Schedule (Optional)</label>
              <input 
                id="scheduled-at"
                type="datetime-local" 
                class="form-control" 
                [(ngModel)]="newNotification.scheduledAt" 
                name="scheduledAt"
                title="Schedule notification date and time"
                aria-label="Scheduled date">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="closeComposeModal()">Cancel</button>
          <button type="button" class="btn btn-primary" (click)="sendNotification()">Send Notification</button>
        </div>
      </div>
    </div>
  </div>
</div>
